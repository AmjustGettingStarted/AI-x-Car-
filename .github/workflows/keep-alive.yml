# Backup keep-alive. Vercel Cron (vercel.json) is primary.
# GitHub disables scheduled workflows after about 60 days without repo activity.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 8 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/keep-alive"
